<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayExpert - Registro</title>
  <link rel="stylesheet" href="estilo_inicio_registro.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

  <header>
    <div class="logo">
      <h1>PlayExpert</h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="iniciosesion.html">Iniciar Sesión</a></li>
      </ul>
    </nav>
  </header>

  <main class="registro-container">
    <div class="card-registro">
      <h2><i class="fas fa-user-plus"></i> Crear Cuenta</h2>
      <p class="subtitulo">Regístrate para comenzar a apostar y ganar.</p>

      <form id="registroForm">
        <div class="input-group">
          <label for="nombre"><i class="fas fa-user"></i> Nombre Completo</label>
          <input type="text" id="nombre" required placeholder="Tu nombre completo">
        </div>

        <div class="input-group">
          <label for="correo"><i class="fas fa-envelope"></i> Correo Electrónico</label>
          <input type="email" id="correo" required placeholder="correo@ejemplo.com">
        </div>

        <div class="input-group">
          <label for="cedula"><i class="fas fa-id-card"></i> Cédula de Ciudadanía</label>
          <input type="text" id="cedula" required placeholder="Número de cédula">
        </div>

        <div class="input-group">
          <label for="fecha_expedicion"><i class="fas fa-calendar-alt"></i> Fecha de Expedición de Cédula</label>
          <input type="date" id="fecha_expedicion" required>
        </div>

        <div class="input-group">
          <label for="fecha_nacimiento"><i class="fas fa-birthday-cake"></i> Fecha de Nacimiento</label>
          <input type="date" id="fecha_nacimiento" required>
          <p id="mensaje_edad" style="font-size: 0.8em; margin-top: 5px;"></p>
        </div>

        <div class="input-group">
          <label for="telefono"><i class="fas fa-phone"></i> Teléfono Móvil</label>
          <input type="tel" id="telefono" required placeholder="Número de celular">
        </div>

        <div class="input-group">
          <label for="ciudad"><i class="fas fa-city"></i> Ciudad</label>
          <input type="text" id="ciudad" required placeholder="Tu ciudad">
        </div>

        <div class="input-group">
          <label for="contrasena"><i class="fas fa-lock"></i> Contraseña</label>
          <input type="password" id="contrasena" required placeholder="Contraseña segura">
        </div>

        <button type="submit" class="btn-submit">Registrarse y Obtener Bono</button>
      </form>

      <p class="footer-link">¿Ya tienes una cuenta? <a href="iniciosesion.html">Inicia sesión aquí</a></p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 PlayExpert. Todos los derechos reservados.</p>
  </footer>

  <!-- Aquí conectamos el archivo registro.js con tu lógica y Firebase -->
  <script type="module" src="registro.js"></script>

</body>
</html>
