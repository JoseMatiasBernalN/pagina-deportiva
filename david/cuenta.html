<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PlayExpert - Mi Cuenta</title>
  <link rel="stylesheet" href="estilo_inicio_registro.css">
  <style>
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #1a1a1a; color: white; }
    nav a { color: white; text-decoration: none; margin: 0 10px; font-weight: bold; }
    .botones-accion { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
    .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; color: white; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>PlayExpert</h1>
    <nav>
      <a href="live.html">Inicio</a>
      <a href="juegos.html">Juegos</a>
      <a href="apuestas_live.html">Apuestas</a>
      <a href="Futbol.html">Jugadores</a>
      <a id="btnAdmin" href="admin.html" style="display: none; background-color: #e74c3c; padding: 6px 12px; border-radius: 4px;">Panel Admin</a>
      <button id="btnCerrarSesion" style="background-color: #333; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">Cerrar Sesión</button>
    </nav>
  </header>

  <main class="registro-container" style="flex-wrap:wrap;gap:20px;align-items:flex-start">
    <div class="card-registro">
      <h2>Perfil de Usuario</h2>
      <div id="infoUsuario" style="margin-top: 20px;">
        <p><strong>Nombre:</strong> <span id="lblNombre">Cargando...</span></p>
        <p><strong>Correo:</strong> <span id="lblCorreo">Cargando...</span></p>
        <p><strong>Saldo Actual:</strong> $<span id="lblSaldo">0</span></p>
      </div>

      <!-- Tus botones originales recuperados -->
      <div class="botones-accion">
        <a href="depositar.html" class="btn" style="background-color: #27ae60;">Depositar</a>
        <a href="retirar.html" class="btn" style="background-color: #2980b9;">Retirar</a>
        <a href="historial.html" class="btn" style="background-color: #f39c12;">Historial</a>
      </div>
    </div>
    <div class="card-registro" id="graficas"><h2>Mis estadísticas</h2><p>Cargando...</p></div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Validar sesión
      if (localStorage.getItem('sesion_activa') !== 'true') {
        window.location.href = 'iniciosesion.html';
        return;
      }

      // Cargar datos
      document.getElementById('lblNombre').textContent = localStorage.getItem('usuario_nombre');
      document.getElementById('lblCorreo').textContent = localStorage.getItem('usuario_correo');
      document.getElementById('lblSaldo').textContent = localStorage.getItem('usuario_saldo');

      // Mostrar Admin si corresponde
      if (localStorage.getItem('es_admin') === 'true') {
        document.getElementById('btnAdmin').style.display = 'inline-block';
      }

      // Cerrar Sesión
      document.getElementById('btnCerrarSesion').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = 'iniciosesion.html';
      });
    });
  </script>
  <script type="module">
    import { db, collection, getDocs, query, where, money, logueado } from './pro.js';
    const box = document.getElementById('graficas');
    (async () => {
      if (!logueado()) return;
      const t = { 'Depósitos': 0, 'Retiros': 0, 'Apuestas': 0, 'Premios': 0, 'Pérdidas': 0 };
      let g = 0, p = 0;
      try {
        const s = await getDocs(query(collection(db, 'historial_apuestas'), where('usuarioId', '==', localStorage.getItem('usuario_id'))));
        s.forEach(d => {
          const x = d.data(), n = x.numValor || 0, de = x.descripcion || '', gano = (x.valor || '').includes('+');
          if (de.startsWith('Depósito')) t['Depósitos'] += n;
          else if (de.startsWith('Retiro')) t['Retiros'] += n;
          else if (de.startsWith('Apuesta') || de.startsWith('Combinada')) t['Apuestas'] += n;
          else if (de.startsWith('Cash')) t['Premios'] += n;
          else if (de.startsWith('Juego')) { if (gano) { t['Premios'] += n; g++; } else { t['Pérdidas'] += n; p++; } }
        });
      } catch (e) { box.innerHTML = '<h2>Mis estadísticas</h2><p>No se pudieron cargar.</p>'; return; }
      const colores = ['#16a34a', '#2563eb', '#f59e0b', '#9333ea', '#dc2626'];
      const max = Math.max(...Object.values(t), 1), total = g + p, tasa = total ? Math.round(g * 100 / total) : 0;
      const barras = Object.entries(t).map(([k, v], i) => {
        const w = Math.round(v / max * 170), y = i * 34;
        return `<text x="0" y="${y + 15}" font-size="12" fill="#333">${k}</text>
                <rect x="80" y="${y}" width="${Math.max(w, 2)}" height="20" rx="4" fill="${colores[i]}"/>
                <text x="${86 + w}" y="${y + 15}" font-size="11" fill="#333">${money(v)}</text>`;
      }).join('');
      const r = 38, c = 2 * Math.PI * r, v = c * tasa / 100;
      box.innerHTML = `<h2>Mis estadísticas</h2>
        <svg viewBox="0 0 400 170" width="100%" role="img" aria-label="Movimientos por categoría">${barras}</svg>
        <div style="display:flex;align-items:center;gap:16px;justify-content:center;margin-top:12px">
          <svg width="96" height="96" viewBox="0 0 100 100" role="img" aria-label="Porcentaje de juegos ganados">
            <circle cx="50" cy="50" r="${r}" fill="none" stroke="#fecaca" stroke-width="14"/>
            <circle cx="50" cy="50" r="${r}" fill="none" stroke="#16a34a" stroke-width="14" stroke-dasharray="${v} ${c}" transform="rotate(-90 50 50)"/>
            <text x="50" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#333">${tasa}%</text>
          </svg>
          <div style="text-align:left"><b>Juegos ganados</b><br>${g} de ${total} jugadas</div>
        </div>`;
    })();
  </script>
</body>
</html>
